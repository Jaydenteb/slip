name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slip
          POSTGRES_PASSWORD: slip
          POSTGRES_DB: slip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://slip:slip@localhost:5432/slip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Database tests (parent chat privacy)
        run: npm run test:db
      - name: Build
        run: npm run build
