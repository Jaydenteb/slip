# Render Blueprint: one web service and one Postgres database.
# Free plans while building. Before submission (by 9 Nov 2026) switch both to paid
# (web 0.5c-512mb, database 0.1c-256mb): free web services sleep and free databases
# expire, and judges need the demo up and quick until judging ends on 15 Dec 2026.
databases:
  - name: slip-db
    plan: free
    region: oregon
    databaseName: slip
    user: slip

services:
  - type: web
    name: slip
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    # Brings the schema up to date and seeds the demo school only if it is empty, then
    # starts the app. (Free plans have no pre-deploy step; on paid plans this can move
    # to preDeployCommand.)
    startCommand: npx prisma db push --skip-generate && npx tsx prisma/seed-if-empty.ts && npm start
    healthCheckPath: /api/health
    envVars:
      # Pinned to a patched release (Node's 21 Oct 2026 security release: TLS hostname
      # checks, Brotli, the eMudhra certificates). Raise it as new patches come out.
      - key: NODE_VERSION
        value: "22.23.4"
      - key: DATABASE_URL
        fromDatabase:
          name: slip-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SANDBOX_SCHOOL_EMAIL
        sync: false
      - key: SANDBOX_PARENT_EMAIL
        sync: false
